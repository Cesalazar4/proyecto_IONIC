<ion-header>
  <ion-toolbar>
    <ion-title>{{ character.name }}</ion-title>
    <ion-buttons slot="end">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="character-config">
    <h2>{{ character.name }}</h2>
    <img [src]="character.image" alt="{{ character.name }}">
    <!-- Aquí puedes añadir los elementos de configuración de la segunda imagen -->
    <div class="stats">
      <div>Configuración del personaje {{ character.name }}</div>
      <!-- Bloques de estadísticas y configuraciones como la segunda imagen -->
    </div>
  </div>
</ion-content>
