<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/"></ion-back-button>
    </ion-buttons>
    <ion-title>Options</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="login-background" [fullscreen]="true">
  <div class="background-image"></div>
  <div class="login-container">
    <ion-card>
      <!-- Header Card -->
      <ion-card-header class="header-container">
        <img class="espada" src="/assets/Imagens/Espadas.png" alt="Logo" (click)="menu()">
        <ion-card-title class="login-title">Options</ion-card-title>
      </ion-card-header>

      <ion-card-content>
        <!-- Música -->
        <div class="option-item">
          <span>Music </span>
          <ion-input [(ngModel)]="musica" placeholder="Ingresa 0 o 1 para Música" type="number"></ion-input>
        </div>

        <!-- Sonido -->
        <div class="option-item">
          <span>Sound </span>
          <ion-input [(ngModel)]="sonido" placeholder="Ingresa 0 o 1 para Sonido" type="number"></ion-input>
        </div>

        <!-- Brillo -->
        <div class="option-item">
          <span>Brillo </span>
          <ion-input [(ngModel)]="brillo" placeholder="Ingresa un valor entre 0 y 100 para Brillo" type="number"></ion-input>
        </div>

        <!-- Contador de jugadores -->
        <div class="players-counter" (click)="generarNumero()">
          <h2># Jugadores</h2>
          <div class="player-count">
            <h3>{{ randomPlayerCount }}</h3>
          </div>
        </div>

        <div class="x">
          <!-- Botón para Crear Sala -->
          <ion-button class="login-button" fill="clear" (click)="crearSala()">Crear Sala</ion-button>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
