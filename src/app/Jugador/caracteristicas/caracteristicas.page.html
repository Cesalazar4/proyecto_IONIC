<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/perfil"></ion-back-button>
    </ion-buttons>
    <ion-title>Características</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="goToHome()">
        <ion-icon name="log-out-outline"></ion-icon>
        Cerrar sesión
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="stats-content">
  <div class="stats-container">
    <div class="background-image"></div>
    
    <div class="stats-table">
      <div class="table-header">
        <div class="header-cell">Característica</div>
        <div class="header-cell">P. Base</div>
        <div class="header-cell">Bonificador</div>
        <div class="header-cell">B. por Competencia</div>
        <div class="header-cell">B. por Equipo</div>
        <div class="header-cell">Se le Suma al Dado</div>
      </div>

      <div class="table-row" *ngFor="let stat of data.caracteristicas">
        <div class="cell nombre">{{ stat.caracteristica }}</div>
        <div class="cell">{{ stat.p_base }}</div>
        <div class="cell" [class.negative]="stat.bonificador < 0">{{ stat.bonificador }}</div>
        <div class="cell">{{ stat.b_competencia }}</div>
        <div class="cell">—</div>
        <div class="cell" [class.negative]="stat.sumaAlDado < 0">{{ stat.suma_lado }}</div>
      </div>
    </div>
  </div>
</ion-content>
